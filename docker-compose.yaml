# nginx proxy address - http://172.17.0.1:13378

name: audiobookshelf
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    pull_policy: always
    container_name: audiobookshelf-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - audiobookshelf
    ports:
      - "172.17.0.1:13378:80"
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./volumes/config/audiobookshelf:/config
      - ./volumes/data/audiobookshelf:/metadata
      - ./volumes/data/media:/media
      - ./volumes/data/downloads:/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  audiobookshelf:
    external: false
