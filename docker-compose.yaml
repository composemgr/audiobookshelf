# nginx proxy address - http://172.17.0.1:64114

name: audiobookshelf
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: audiobookshelf-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '80']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64114:80'
    volumes:
      - './volumes/config/audiobookshelf:/config'
      - './volumes/data/audiobookshelf:/metadata'
      - './volumes/data/media/audiobooks:/audiobooks'
      - './volumes/data/media/podcasts:/podcasts'
    networks:
      - audiobookshelf

networks:
  audiobookshelf:
    name: audiobookshelf
    external: false
